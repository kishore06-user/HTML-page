<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FitBuddy - AI Fitness Plan Generator">
    <title>{% block title %}FitBuddy{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>

<body>
    <header class="navbar">
        <div class="nav-inner">
            <a href="/" class="brand" aria-label="FitBuddy Home">
                <span class="brand-icon" aria-hidden="true">💪</span>
                <span>FitBuddy</span>
            </a>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="/">Home</a>
                <a href="/view-all-users">Admin</a>
                <a href="/docs">API</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>FitBuddy — AI Fitness Plan Generator</p>
        <p class="small">
            AI-generated fitness guidance is not a substitute for professional medical advice.
        </p>
    </footer>
</body>
</html>
